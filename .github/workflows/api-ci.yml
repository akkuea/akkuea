name: API - Quality and Security CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/api-ci.yml'

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.x'

jobs:
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: akkuea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Type checking
      run: |
        cd apps/api
        bun run type-check
    - name: Linting with ESLint
      run: |
        cd apps/api
        bun run lint
        
    - name: Format checking with Prettier
      run: |
        cd apps/api
        bun run format:check
        
    - name: Build application
      run: |
        cd apps/api
        bun run build

    - name: Wait for the target database to accept real connections
      # The service container's `pg_isready` healthcheck reports the server
      # ready as soon as it accepts any TCP connection, which can be before
      # the `POSTGRES_DB`/`POSTGRES_USER` the entrypoint provisions are fully
      # usable. Migrating or testing against that half-ready window has
      # intermittently failed downstream (e.g. auth role errors, permission
      # checks reading back inconsistent rows). Poll with the actual
      # credentials and database name before proceeding.
      run: |
        for i in $(seq 1 30); do
          if PGPASSWORD=test psql -h localhost -U test -d akkuea_test -c 'SELECT 1' > /dev/null 2>&1; then
            echo "Database is ready"
            exit 0
          fi
          echo "Waiting for the database to be ready ($i/30)..."
          sleep 2
        done
        echo "Database did not become ready in time"
        exit 1

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
      run: |
        cd apps/api
        bun run db:migrate

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
        TEST_DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
        JWT_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
      run: |
        cd apps/api
        # --isolate: confirmed by diagnostic runs that the E2E tokenization
        # suite (src/__tests__/e2e.fullflow.test.ts) passes on its own but
        # fails in the full run; some other file leaks module-level state
        # (most likely a monkey-patched StellarService singleton method left
        # unrestored) into it. --isolate gives every file its own global and
        # module registry, closing that class of leak at the source instead
        # of hunting down the one leaking file. --max-concurrency=1 stays for
        # the shared database service container.
        bun test --coverage --coverage-threshold=60 --max-concurrency=1 --isolate

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Audit dependencies
      run: bash .github/scripts/dependency-audit.sh .

    - name: Install gitleaks
      run: |
        # Install gitleaks for secret scanning - pinned version for reproducibility
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version

    - name: Scan for hardcoded secrets (gitleaks)
      run: |
        gitleaks detect \
          --source . \
          --config .gitleaks.toml \
          --no-banner \
          --redact

    - name: Verify secret scanner catches planted fixture
      # Prove the scanner works: scan the fixture file WITHOUT the allowlist.
      # gitleaks must exit non-zero (secret found). If it exits 0 the scanner
      # is misconfigured and we fail the job explicitly.
      run: |
        gitleaks detect \
          --source .github/security/secret-scan-fixture.txt \
          --no-git \
          --no-banner \
          --config /dev/null \
        && { echo "ERROR: scanner did not detect the planted fixture secret"; exit 1; } \
        || echo "OK: scanner correctly detected the planted fixture pattern"

    - name: Mainnet preflight unit tests
      run: bash scripts/test-mainnet-preflight.sh

    - name: Mainnet preflight dry-run (env checks only)
      env:
        STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        STELLAR_HORIZON_URL: "https://horizon.stellar.org"
        STELLAR_RPC_URL: "https://soroban.stellar.org"
        DATABASE_SSL: "true"
        NODE_ENV: "production"
        JWT_SECRET: "ci-placeholder-that-is-at-least-32-characters-long"
        OPERATIONS_BACKEND_CREDENTIAL: "ci-placeholder-ops-credential-value"
        OPERATIONS_ALLOWED_WALLETS: "GCEZWKCA5VLDNRLN3RPRJMRZOX3Z6G5CHCGBWN9YKTNFGNQ45UCXJ5CA"
        STELLAR_ADMIN_SECRET: "SCZANGBA5IXFX5QOPEQV5M3Q6JCDIZQKQWVKJ7VG3PWJVS4RWCF6ZABC"
      run: bash scripts/mainnet-preflight.sh --env-only

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Complexity analysis
      run: |
        cd apps/api

        # bunx auto-downloads complexity-report without modifying workspace dependencies
        bunx complexity-report src/ --format json --output complexity.json || true

        # Check for overly complex functions
        if [ -f "complexity.json" ]; then
          echo "Complexity analysis completed"
          cat complexity.json
        fi
