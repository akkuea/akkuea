name: WebApp - Quality and Security CI

# no-op touch to force a fresh scheduling of this workflow
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/webapp/**"
      - ".github/workflows/webapp-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Build and Test WebApp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build shared library (required for webapp type checking)
        run: |
          cd apps/shared
          bun run build

      - name: Type checking
        run: |
          cd apps/webapp
          bun run type-check
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: ESLint checking
        run: |
          cd apps/webapp
          bun run lint

      - name: Format checking with Prettier
        run: |
          cd apps/webapp
          bunx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Build application
        run: |
          cd apps/webapp
          bun run build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Run unit tests
        run: |
          cd apps/webapp
          bun test --coverage --coverage-threshold=60
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Analyze bundle size
        run: |
          cd apps/webapp

          # Check if .next directory exists and size is reasonable
          if [ -d ".next" ]; then
            BUILD_SIZE=$(du -sk .next | cut -f1)
            echo "Build size: ${BUILD_SIZE}KB"
            
            # Warn if build is too large (>50MB)
            if [ $BUILD_SIZE -gt 51200 ]; then
              echo "Warning: Build size is large ($BUILD_SIZE KB)"
            fi
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: apps/webapp/.next/
          retention-days: 4

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build shared library (required for webapp security checks)
        run: |
          cd apps/shared
          bun run build

      - name: Audit dependencies
        run: bash .github/scripts/dependency-audit.sh .

      - name: Check for secrets in code
        run: |
          cd apps/webapp

          # Scan for potential secrets
          echo "Scanning for potential secrets..."

          # Common secret patterns
          if grep -r -E "(API_KEY|SECRET|PASSWORD|PRIVATE_KEY)" src/ public/ --exclude-dir=node_modules --exclude-dir=.next; then
            echo "Warning: Potential secret patterns found in source code"
            exit 1
          fi

          # Check for hardcoded URLs
          if grep -r "https://.*\|http://.*" src/ --exclude-dir=node_modules | grep -v "localhost\|127.0.0.1"; then
            echo "Warning: Hardcoded URLs found"
          fi

      - name: Security linting
        run: |
          cd apps/webapp
          bunx eslint src/ --ext .ts,.tsx || true

      - name: Build shared library (required for webapp build)
        run: |
          cd apps/shared
          bun run build

      - name: Check CSP headers
        run: |
          cd apps/webapp

          # Build app first
          SKIP_ENV_VALIDATION=true bun run build

          # Check if CSP headers are configured
          if [ -f "next.config.js" ] || [ -f "next.config.ts" ]; then
            if grep -r "Content-Security-Policy\|CSP" . --exclude-dir=.next; then
              echo "CSP configuration found"
            else
              echo "Warning: No CSP configuration found"
            fi
          fi

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    # Deliberately independent of build-and-test: this suite boots its own
    # dev server and mocks every API call (see apps/webapp/e2e), so it does
    # not need that job's build output, and a failure or slowdown here must
    # never block or delay the unit-test job's own result.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared library (required for webapp)
        run: |
          cd apps/shared
          bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/webapp/bun.lock', '**/bun.lock') }}

      - name: Install Playwright's Chromium browser
        run: |
          cd apps/webapp
          bunx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: |
          cd apps/webapp
          bun run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/webapp/playwright-report/
          retention-days: 14
