[package]
name = "pilot-payout-split"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
pilot-income-token = { path = "../pilot-income-token" }
pilot-whitelist = { path = "../pilot-whitelist" }
