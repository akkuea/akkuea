# Gitleaks configuration for the Akkuea monorepo.
# Docs: https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[[rules]]
id = "akkuea-jwt-dev-fallback"
description = "Akkuea dev JWT fallback literal: this string must never appear in production source"
regex = '''super-secret-default-key-for-dev'''
tags = ["jwt", "hardcoded-secret"]

  [rules.allowlist]
  # Allow in test fixtures and docs; production code must not contain it
  paths = [
    '''apps/api/src/__tests__/''',
    '''apps/api/src/tests/''',
    '''docs/''',
    '''.github/workflows/''',
  ]

[allowlist]
description = "Known safe occurrences: CI placeholders, docs examples, test fixtures, contract IDs"

# Historical git commits that introduced patterns now removed from the working tree.
# Each fingerprint is commit:file:rule:line - the finding only exists in history.
commits = [
  "b3fb31a27d37031b4a57e4738da795961d15c23d",
]

paths = [
  # Planted fixture - intentionally contains a fake secret pattern for scanner self-test
  '''.github/security/secret-scan-fixture.txt''',
  # CI workflow uses placeholder JWT/secret values in test env blocks
  '''.github/workflows/''',
  # Test scripts use synthetic key values to exercise failure branches
  '''scripts/test-mainnet-preflight.sh''',
  # API docs contain curl examples with placeholder Bearer tokens
  '''docs/''',
  # Contract ID JSON files contain Soroban contract addresses (C-prefixed, not secrets)
  '''apps/shared/src/contracts''',
  # Test files use synthetic keys and placeholder tokens
  '''apps/api/src/__tests__/''',
  '''apps/api/src/tests/''',
  '''apps/shared/src/env/__tests__/''',
  '''apps/akkuea-land/src/''',
  '''apps/webapp/src/''',
  '''akkuea-defi-rwa/''',
  '''packages/''',
]
