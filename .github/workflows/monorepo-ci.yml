name: Monorepo - Quality and Security CI

on:
  # Paths filter is intentionally broad so the cheap style/shell gates run on
  # docs changes. Expensive jobs use a dorny/paths-filter step to skip
  # themselves when only docs/scripts/.github files change.
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/**'

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.x'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Filter changed paths
      id: filter
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      with:
        filters: |
          code:
            - 'apps/shared/**'
            - 'apps/api/**'
            - 'apps/webapp/**'
            - 'package.json'
            - 'bun.lock'

  style-quality-gate:
    name: Codebase Style Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Run style quality gate scanner (em dashes and emojis)
      run: python3 .github/scripts/check-style-rules.py .

  shell-lint:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install ShellCheck
      run: |
        # Version-pinned to keep findings stable across runner images.
        SHELLCHECK_VERSION='v0.10.0'
        curl -sL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
          | tar xJ
        sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        shellcheck --version

    - name: Syntax check every tracked shell script with bash -n
      run: |
        status=0
        while IFS= read -r script; do
          echo "bash -n $script"
          bash -n "$script" || status=1
        done < <(git ls-files '*.sh')
        exit $status

    - name: Lint every tracked shell script with ShellCheck
      run: |
        # Fail on error and warning severity. Style-level findings (SC2xxx
        # notes) stay advisory so the gate blocks real breakage without
        # bikeshedding formatting.
        status=0
        while IFS= read -r script; do
          echo "shellcheck $script"
          shellcheck --severity=warning "$script" || status=1
        done < <(git ls-files '*.sh')
        exit $status

    - name: Check shell scripts are executable
      run: |
        # Every tracked .sh file is invoked directly or documented as
        # ./scripts/... in the deployment guides, so it must carry the
        # executable bit. A missing bit only surfaces on a fresh clone, which
        # is exactly when a deployer hits it.
        status=0
        while IFS= read -r script; do
          if [ ! -x "$script" ]; then
            echo "NOT EXECUTABLE: $script (run: git update-index --chmod=+x $script)"
            status=1
          fi
        done < <(git ls-files '*.sh')
        if [ $status -eq 0 ]; then
          echo "All shell scripts are executable"
        fi
        exit $status

  monorepo-integrity:

    name: Monorepo Integrity Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Node.js and Bun
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Check workspace consistency
      run: |
        cd .
        
        # Verify all workspaces are properly configured
        echo "Checking workspace configuration..."
        
        # Check package.json workspaces array
        WORKSPACES=$(jq -r '.workspaces[]' package.json)
        echo "Configured workspaces: $WORKSPACES"
        
        # Verify each workspace has package.json
        for workspace in $WORKSPACES; do
          if [ ! -f "$workspace/package.json" ]; then
            echo "Error: Workspace $workspace missing package.json"
            exit 1
          fi
          echo "✅ $workspace has package.json"
        done
        
    - name: Check dependency consistency
      run: |
        cd .
        
        # Check for shared package references
        echo "Checking cross-workspace dependencies..."
        
        # Check if webapp references shared
        if grep -q "@akkuea/shared" apps/webapp/package.json; then
          echo "✅ Webapp references shared package"
        fi
        
        # Check if API references shared
        if grep -q "@akkuea/shared" apps/api/package.json; then
          echo "✅ API references shared package"
        fi
        
    - name: Validate TypeScript configuration
      run: |
        cd .
        
        # Check TypeScript configurations are consistent
        echo "Validating TypeScript configurations..."
        
        for workspace in apps/*/; do
          if [ -f "$workspace/tsconfig.json" ]; then
            echo "Checking $workspace"
            cat "$workspace/tsconfig.json" | jq . > /dev/null || {
              echo "Error: Invalid tsconfig.json in $workspace"
              exit 1
            }
            echo "✅ $workspace tsconfig.json valid"
          fi
        done

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile
        bun install --workspaces --frozen-lockfile

    - name: Security audit
      run: bash .github/scripts/dependency-audit.sh .

  performance-benchmark:
    name: Performance Benchmark
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Node.js and Bun
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Build performance test
      run: |
        cd .

        echo "Testing shared library build performance..."

        START_TIME=$(date +%s)
        cd apps/shared
        bun install --frozen-lockfile
        bun run build
        END_TIME=$(date +%s)

        TOTAL=$((END_TIME - START_TIME))
        echo "Shared library build: ${TOTAL}s"

        # Documented budget for the shared library build. Measured locally at
        # 5-8s; 120s leaves room for a cold runner plus tsc startup while still
        # failing on a real regression instead of only warning.
        BUDGET=120
        if [ "${TOTAL}" -gt "${BUDGET}" ]; then
          echo "error: shared build took ${TOTAL}s, over the ${BUDGET}s budget" >&2
          exit 1
        fi

    - name: Bundle size analysis
      run: |
        cd .

        echo "Analyzing bundle sizes..."

        # Check shared library (the only workspace this job builds)
        if [ -d "apps/shared/dist" ]; then
          SHARED_SIZE=$(du -sk apps/shared/dist | cut -f1)
          echo "Shared library: ${SHARED_SIZE}KB"
        fi

  integration-test:
    name: Cross-Workspace Integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Node.js and Bun
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Integration tests
      run: |
        cd .

        echo "Running cross-workspace integration tests..."

        # Build shared library first
        cd apps/shared
        bun install --frozen-lockfile
        bun run build
        cd ../..

        # Test API imports from shared
        cd apps/api
        bun install --frozen-lockfile
        echo "Testing API imports..."
        bun -e "const shared = await import('../shared/dist/index.js'); console.log('✅ API can import shared library'); const { ValidationService } = shared; console.log('✅ ValidationService available:', typeof ValidationService);"
        cd ../..

        # Test webapp imports from shared (no webapp install needed; only shared dist is required)
        echo "Testing WebApp imports..."
        bun -e "const shared = await import('./apps/shared/dist/index.js'); console.log('✅ WebApp can import shared library');"

  security-compliance:
    name: Security Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Check for common security issues
      run: |
        cd .
        
        echo "Running security compliance checks..."
        
        # Check for unsafe eval usage
        echo "2. Checking for unsafe eval usage..."
        # Match real call sites only. A bare "eval" substring also matches
        # ordinary words like "retrieval" and "evaluation", which is not unsafe
        # dynamic code and previously failed this job on a doc comment.
        if grep -rE "\beval\(|\bnew Function\(" apps/ --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.next | grep -v "//.*eval\|//.*Function("; then
          echo "Warning: Unsafe eval usage found"
          exit 1
        fi
        echo "✅ No unsafe eval usage found"
        
    - name: Validate package.json security
      run: |
        cd .
        
        echo "Checking package.json security..."
        
        for package_file in apps/*/package.json; do
          if [ -f "$package_file" ]; then
            echo "Checking $package_file"
            
            # Check for scripts that could be exploited
            SCRIPTS=$(jq -r '.scripts // {}' "$package_file" | grep -v "null\|{}")
            if [ "$SCRIPTS" != "{}" ]; then
              echo "Scripts in $package_file: $SCRIPTS"
            fi
            
            # Check for unusual dependencies
            DEPS=$(jq -r '.dependencies // {}' "$package_file")
            if echo "$DEPS" | grep -q -E "(curl\|wget\|fetch)"; then
              echo "Warning: Unusual dependencies in $package_file"
            fi
          fi
        done