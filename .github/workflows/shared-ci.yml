name: Shared Library - Quality and Security CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/shared/**"
      - ".github/workflows/shared-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/shared/**"
      - ".github/workflows/shared-ci.yml"

env:
  NODE_VERSION: "24"
  BUN_VERSION: "latest"

jobs:
  build-and-test:
    name: Build and Test Shared Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules/.cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Type checking
        run: |
          cd apps/shared
          bun run build:types

      - name: Linting with ESLint
        run: |
          cd apps/shared
          bun run lint

      - name: Format checking with Prettier
        run: |
          cd apps/shared
          bun run format:check

      - name: Build
        run: |
          cd apps/shared
          bun run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Audit dependencies
        run: bash .github/scripts/dependency-audit.sh .

  type-safety:
    name: Type Safety Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Strict TypeScript compilation
        run: |
          cd apps/shared

          # Compile with strictest settings
          bunx tsc --noEmit --strict --noImplicitAny --noImplicitReturns --noImplicitThis

      - name: Type coverage analysis
        run: |
          cd apps/shared
          bunx type-coverage --strict --detail

