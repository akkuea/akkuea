name: API - Quality and Security CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/api-ci.yml'

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.x'

jobs:
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: akkuea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
        
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Type checking
      run: |
        cd apps/api
        bun run type-check
    - name: Linting with ESLint
      run: |
        cd apps/api
        bun run lint
        
    - name: Format checking with Prettier
      run: |
        cd apps/api
        bun run format:check
        
    - name: Build application
      run: |
        cd apps/api
        bun run build

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
      run: |
        cd apps/api
        bun run db:migrate

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
        TEST_DATABASE_URL: postgresql://test:test@localhost:5432/akkuea_test
        JWT_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
      run: |
        cd apps/api
        # Run tests sequentially to avoid database race conditions in the shared service container
        bun test --coverage --coverage-threshold=60 --max-concurrency=1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Audit dependencies
      run: bash .github/scripts/dependency-audit.sh .

    - name: Scan for hardcoded secrets
      run: |
        # Fail if any non-test source file contains the known dev fallback literal.
        # Test fixtures may use it as a placeholder; production code must not.
        if grep -r "super-secret-default-key-for-dev" \
            --include="*.ts" \
            --exclude-dir="__tests__" \
            --exclude-dir="tests" \
            apps/api/src/; then
          echo "ERROR: hardcoded dev secret literal found in production source" >&2
          exit 1
        fi
        echo "No hardcoded secret literals found in production source."

    - name: Mainnet preflight dry-run (env checks only)
      env:
        STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
        STELLAR_HORIZON_URL: "https://horizon.stellar.org"
        STELLAR_RPC_URL: "https://soroban.stellar.org"
        DATABASE_SSL: "true"
        NODE_ENV: "production"
        JWT_SECRET: "ci-placeholder-that-is-at-least-32-characters-long"
        OPERATIONS_BACKEND_CREDENTIAL: "ci-placeholder-ops-credential-value"
        OPERATIONS_ALLOWED_WALLETS: "GCEZWKCA5VLDNRLN3RPRJMRZOX3Z6G5CHCGBWN9YKTNFGNQ45UCXJ5CA"
        STELLAR_ADMIN_SECRET: "SCZANGBA5IXFX5QOPEQV5M3Q6JCDIZQKQWVKJ7VG3PWJVS4RWCF6ZABC"
      run: bash scripts/mainnet-preflight.sh --env-only

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      
    - name: Install dependencies
      run: |
        bun install --frozen-lockfile

    - name: Complexity analysis
      run: |
        cd apps/api

        # bunx auto-downloads complexity-report without modifying workspace dependencies
        bunx complexity-report src/ --format json --output complexity.json || true

        # Check for overly complex functions
        if [ -f "complexity.json" ]; then
          echo "Complexity analysis completed"
          cat complexity.json
        fi
