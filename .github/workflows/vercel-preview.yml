name: WebApp – Preview CI Checks

# Runs quality checks on pull requests targeting develop.
# Vercel preview deployments are handled automatically by the Vercel GitHub
# integration - no CLI steps needed here.
# no-op touch to force a fresh scheduling of this workflow

on:
  pull_request:
    branches:
      - develop
    paths:
      - "apps/webapp/**"
      - ".github/workflows/vercel-preview.yml"

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Type-check, Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared library
        run: |
          cd apps/shared
          bun run build

      - name: Type checking
        working-directory: apps/webapp
        run: bun run type-check
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: ESLint
        working-directory: apps/webapp
        run: bun run lint

      - name: Prettier format check
        working-directory: apps/webapp
        run: bunx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"
